name: Build KPI-ORC.exe

on:
  push:
    branches:
      - claude/python-api-compiler-8H0AR
      - main

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install pyinstaller openpyxl flask "pywebview>=4.0"

      - name: Build exe
        shell: pwsh
        run: pyinstaller --onefile --windowed --name "KPI-ORC" --hidden-import flask --hidden-import webview --hidden-import webview.platforms.edgechromium --collect-all webview main.py

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: KPI-ORC-exe
          path: dist\KPI-ORC.exe
          retention-days: 30

      - name: Publish release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-build --yes 2>&1 | Out-Null
          gh release create latest-build "dist\KPI-ORC.exe" --title "Dernier build" --notes "Build automatique depuis ${{ github.ref_name }}" --latest
