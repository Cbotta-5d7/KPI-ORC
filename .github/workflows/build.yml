name: Compiler KPI-ORC.exe

on:
  push:
    branches:
      - CLAUDE/python-api-compiler-8H0AR

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: |
          pip install pyinstaller
          pip install openpyxl

      - name: Afficher les fichiers du repo
        run: dir

      - name: Compiler le .exe
        run: pyinstaller --onefile --windowed --clean --name "KPI-ORC" main.py

      - name: Verifier le contenu du dossier dist
        run: dir dist

      - name: Publier le .exe
        uses: actions/upload-artifact@v4
        with:
          name: KPI-ORC-exe
          path: dist/KPI-ORC.exe
