name: Compiler KPI-ORC.exe

on:
  push:
    branches:
      - claude/python-exe-files-EF09j

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: pip install pyinstaller openpyxl

      - name: Compiler le .exe
        run: pyinstaller --onefile --windowed --name "KPI-ORC" main.py

      - name: Publier le .exe
        uses: actions/upload-artifact@v4
        with:
          name: KPI-ORC-exe
          path: dist/KPI-ORC.exe
