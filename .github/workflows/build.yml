name: Compiler KPI-ORC.exe

on:
  push:
    branches:
      - CLAUDE/python-api-compiler-8H0AR

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Recuperer le repo
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer PyInstaller + dependances
        run: |
          pip install pyinstaller
          pip install openpyxl

      - name: Lister les fichiers (debug)
        run: dir

      # 👇 ICI tu changes juste le fichier si besoin
      - name: Compiler le .exe
        run: pyinstaller --onefile --windowed --clean --name "KPI-ORC" TON_FICHIER.py

      - name: Verifier le dossier dist
        run: dir dist

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: KPI-ORC-exe
          path: dist/KPI-ORC.exe
